syntax = "proto3";

import "google/protobuf/empty.proto";
import "validate/validate.proto";

option java_multiple_files = true;
option java_package = "api.edu.school21.proto.grpc.v1";
option java_outer_classname = "UserProto";

service User {
  rpc Create (CreateUserRqDto) returns (JwtTokenRsDto);
  rpc Authentification (AuthentificationUserRqDto) returns (JwtTokenRsDto);
  rpc ChangePassword (ChangeUserPasswordRqDto) returns (JwtTokenRsDto);
  rpc PasswordRecovery (PasswordRecoveryUserRqDto) returns (google.protobuf.Empty);
  rpc IsUserAuthorize (google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc RefreshUserToken (google.protobuf.Empty) returns (JwtTokenRsDto);
}

message CreateUserRqDto {
  string firstName = 1 [(validate.rules).string.min_len = 2, (validate.rules).string.max_len = 255];
  string lastName = 2 [(validate.rules).string.min_len = 2, (validate.rules).string.max_len = 255];
  string password = 3 [(validate.rules).string.min_len = 5, (validate.rules).string.max_len = 255];
  string phoneNumber = 4 [(validate.rules).string.pattern = "^(8|\\+7)\\(\\d{3}\\)\\d{3}-\\d{2}-\\d{2}$"];
  string mail = 5 [
    (validate.rules).string.email = true,
    (validate.rules).string.min_len = 5,
    (validate.rules).string.max_len = 255
  ];
}

message AuthentificationUserRqDto {
  string mail = 1 [
    (validate.rules).string.email = true,
    (validate.rules).string.min_len = 5,
    (validate.rules).string.max_len = 255
  ];
  string password = 2 [(validate.rules).string.min_len = 5, (validate.rules).string.max_len = 255];
}

message PasswordRecoveryUserRqDto {
  string mail = 1 [
    (validate.rules).string.email = true,
    (validate.rules).string.min_len = 5,
    (validate.rules).string.max_len = 255
  ];
}

message ChangeUserPasswordRqDto {
  string newPassword = 3 [(validate.rules).string.min_len = 5, (validate.rules).string.max_len = 255];
}

message JwtTokenRsDto {
  string token = 1;
}